<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Salary Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center mb-4">Employee Salary Management</h2>

    <div class="d-flex justify-content-between mb-3">
        <a th:href="@{/showNewEmployeeForm}" class="btn btn-primary">Add Employee</a>

        <form th:action="@{/}" method="get" class="d-flex">
            <input type="text" name="keyword" class="form-control me-2" placeholder="Search employee">
            <button class="btn btn-success">Search</button>
        </form>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="employee : ${listEmployees}">
            <td th:text="${employee.id}"></td>
            <td th:text="${employee.name}"></td>
            <td th:text="${employee.department}"></td>
            <td th:text="${employee.salary}"></td>
            <td>
                <a th:href="@{/showFormForUpdate/{id}(id=${employee.id})}"
                   class="btn btn-warning btn-sm">Edit</a>

                <a th:href="@{/deleteEmployee/{id}(id=${employee.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete this employee?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
