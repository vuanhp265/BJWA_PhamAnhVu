<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Update Employee</h2>

    <form th:action="@{/saveEmployee}" th:object="${employee}" method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label>Name</label>
            <input type="text" th:field="*{name}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Department</label>
            <input type="text" th:field="*{department}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Salary</label>
            <input type="number" th:field="*{salary}" class="form-control">
        </div>

        <button type="submit" class="btn btn-warning">Update</button>
        <a th:href="@{/}" class="btn btn-secondary">Back</a>
    </form>
</div>
</body>
</html>
